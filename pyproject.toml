[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dirwatch"
version = "1.0.0"
description = "Lightweight self-hosted dashboard for monitoring Active Directory domain controller health — replication, SYSVOL, LDAP bind, and service status at a glance."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OneByJorah", email = "info@jorahone.com"}]
keywords = ["active-directory", "domain-controller", "monitoring", "dashboard", "flask", "powershell", "windows", "sysadmin", "ad-health", "jorahone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]

[project.urls]
Homepage = "https://github.com/OneByJorah/DirWatch"
Repository = "https://github.com/OneByJorah/DirWatch"
Issues = "https://github.com/OneByJorah/DirWatch/issues"

[tool.setuptools.packages.find]
include = ["dirwatch*"]
